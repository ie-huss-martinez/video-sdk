# The repository root is the published package, @hussmartinez/video-sdk, as in
# the family's standard layout. The examples and the end-to-end suite join the
# workspace when they're added.

# One version of each tool for the whole workspace. Packages refer to these
# with `catalog:`, and pnpm writes the real ranges into published manifests.
catalog:
  "@arethetypeswrong/cli": ^0.18.5
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@biomejs/biome": ^2.6.5
  "@commitlint/cli": ^21.2.4
  "@hussmartinez/sdk-config": ^0.2.1
  "@hussmartinez/sdk-core": ^0.4.0
  "@microsoft/api-extractor": ^7.60.1
  "@size-limit/file": ^14.3.0
  "@types/node": ^24.19.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitest/browser-playwright": 5.1.0
  dependency-cruiser: ^18.7.2
  fast-check: ^4.10.2
  husky: ^9.1.7
  lint-staged: ^17.6.0
  # Pinned exactly, bundled unmodified into the workers (ADR 0001).
  mediabunny: 1.65.2
  playwright: ^1.64.1
  publint: ^0.3.25
  react: ^19.3.0
  react-dom: ^19.3.0
  secretlint: ^13.1.0
  size-limit: ^14.3.0
  stylelint: ^18.0.0
  typescript: ^6.0.3
  vite: ^8.3.6
  vitest: ^5.1.0

# Supply-chain hardening (ADR 0012).
# Dependency install scripts are blocked unless allowlisted here.
allowBuilds: {}
# Fail the install when an unapproved package wants to run a build script.
strictDepBuilds: true
# Don't resolve versions published less than a day ago, except the family's
# own, which provenance, trustPolicy and the reviewer's check cover (sdk-core
# ADR 0044).
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@hussmartinez/*"
# Refuse a version with weaker publish provenance than an earlier one.
trustPolicy: no-downgrade
# Transitive dependencies must come from the registry, not git or tarball URLs.
blockExoticSubdeps: true
