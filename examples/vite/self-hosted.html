<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Workers only from this origin: no blob:, so only the self-hosted workers can start. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The video editor, with its workers self-hosted</title>
  </head>
  <body>
    <main>
      <h1>The video editor, with its workers self-hosted</h1>
      <div id="editor" data-assets-url="/video-sdk/"></div>
    </main>
    <script type="module" src="/src/editor.tsx"></script>
  </body>
</html>
